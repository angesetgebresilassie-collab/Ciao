name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Save error summary to repo
        if: always()
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "== errors =="
            grep -E '^e: |Could not|Unresolved|incompatible' build.log | head -60
            echo "== tail =="
            tail -n 80 build.log
          } > ci/last-build.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci/last-build.txt
          git commit -m "ci: last build log [skip ci]" || exit 0
          git pull --rebase || true
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: Ciao-debug-apk
          path: app/build/outputs/apk/debug/*.apk
